name: CI
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PORT: 3000
      DATABASE_URL: postgresql://user:pass@localhost:5432/db_test
      JWT_SECRET: jwt_secret_ci
      JWT_REFRESH_SECRET: jwt_resfresh_secret_ci
      JWT_PWD_SETUP_SECRET: 123465_ci
      JWT_PWD_SETUP_PURPOSE: pwd_setup_ci
      JWT_PWD_SETUP_ISSUER: company-api_ci
      JWT_PWD_SETUP_AUDIENCE: pwd-setup_ci
      JWT_PWD_RESET_SECRET: 123456_ci
      JWT_PWD_RESET_PURPOSE: pwd_reset_ci
      JWT_PWD_RESET_ISSUER: company-api_ci
      JWT_PWD_RESET_AUDIENCE: pwd-reset_ci
      FRONTEND_URL: http://localhost:4200
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm prisma generate --config prisma7.config.ts

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Unit tests
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: db_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate --config prisma7.config.ts
      - name: Create .env.test # <- aquí
        run: |
          cat > .env.test <<EOF
          PORT: 3000
          DATABASE_URL=postgresql://user:pass@localhost:5432/db_test
          JWT_SECRET=jwt_secret_ci
          JWT_REFRESH_SECRET=jwt_resfresh_secret_ci
          JWT_PWD_SETUP_SECRET=123465_ci
          JWT_PWD_SETUP_PURPOSE=pwd_setup_ci
          JWT_PWD_SETUP_ISSUER=company-api_ci
          JWT_PWD_SETUP_AUDIENCE=pwd-setup_ci
          JWT_PWD_RESET_SECRET=123456_ci
          JWT_PWD_RESET_PURPOSE=pwd_reset_ci
          JWT_PWD_RESET_ISSUER=company-api_ci
          JWT_PWD_RESET_AUDIENCE=pwd-reset_ci
          FRONTEND_URL=http://localhost:4200
          EOF
      - run: pnpm test:e2e
